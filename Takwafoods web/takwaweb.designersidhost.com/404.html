<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page not found | Takwa Foods</title>
    <link rel="icon" href="/uploads/shared/favicon-2025-06-10-01-43-52-8008.png">
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fustat:wght@200..800&amp;display=swap" rel="stylesheet">
    <!-- Served by Apache for any missing URL, so every path here is absolute.
         Standalone on purpose: the shared header and footer need the full
         script stack, and a missing-page response should stay light. -->
    <style>
        :root { --primary-color: #042A2D; --accent-color: #73ED7C; --text-color: #767676; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
               justify-content: center; padding: 32px 16px; background: #fff; color: var(--primary-color);
               font-family: "Fustat", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif; text-align: center; }
        img { width: 140px; height: auto; margin-bottom: 28px; }
        h1 { font-size: 30px; margin: 0 0 10px; }
        p { color: var(--text-color); margin: 0 0 22px; max-width: 34em; line-height: 1.7; }
        section[lang="ar"] { direction: rtl; margin-top: 40px; padding-top: 32px; border-top: 1px solid #DFE1DE; width: 100%; max-width: 560px; }
        a.btn { display: inline-block; padding: 12px 28px; border-radius: 50px; background: var(--primary-color);
                color: #fff; text-decoration: none; font-weight: 600; }
        a.btn:focus-visible { outline: 3px solid var(--accent-color); outline-offset: 3px; }
        .links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <img src="/uploads/shared/logo-2025-06-10-01-43-50-9143.png" alt="Takwa Foods">

    <section lang="en">
        <h1>Page not found</h1>
        <p>The page you asked for is not here. It may have moved, or the link may have been copied incompletely.</p>
        <div class="links">
            <a class="btn" href="/index.html">Go to the homepage</a>
            <a class="btn" href="/listings.html">See our products</a>
            <a class="btn" href="/contact-us.html">Contact us</a>
        </div>
    </section>

    <section lang="ar" dir="rtl">
        <h1>الصفحة غير موجودة</h1>
        <p>الصفحة التي طلبتها غير موجودة هنا. ربما نُقلت، أو نُسخ الرابط بشكل غير مكتمل.</p>
        <div class="links">
            <a class="btn" href="/index-ar.html">الصفحة الرئيسية</a>
            <a class="btn" href="/listings-ar.html">منتجاتنا</a>
            <a class="btn" href="/contact-us-ar.html">اتصل بنا</a>
        </div>
    </section>
</body>
</html>
